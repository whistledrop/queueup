# The QueueUp website on Netlify. The Go relay is NOT deployed here; it lives
# on Fly.io (see docs/deploy.md).

[build]
  base    = "web"
  command = "npm run build"
  # Relative to base, so this is web/.next: the Next.js build output. Pinned
  # here because the value saved at site creation (before Netlify knew this was
  # a Next.js app) pointed at the base folder itself, which the runtime rejects.
  publish = ".next"

# Declared explicitly rather than relying on auto-detection: with the app in a
# subfolder, Netlify's Next.js detection can miss at site-creation time, and
# without this the deploy publishes nothing but 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Analytics. Both of these reach the browser, which is the point: PostHog runs
# in the page. A phc_ project key is public by design — it ships inside the
# JavaScript every visitor downloads, so writing it here reveals nothing that
# opening the site would not. It is a write-only key: it can send events to
# this project and cannot read anything back.
#
# The secrets stay out. RELAY_URL is set in the Netlify dashboard (Site
# configuration, Environment variables), and the Stripe and admin keys live on
# Fly as secrets. Nothing in this file is worth stealing.
[build.environment]
  NEXT_PUBLIC_POSTHOG_KEY  = "phc_uiyViY3BWd4LjV6eiwi5fKtgDsmrJZok4C7Ec4QLtcAm"
  NEXT_PUBLIC_POSTHOG_HOST = "https://eu.i.posthog.com"
